<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чат-бот: Россия, патриотизм и Добровольский</title>
<style>
:root{--ink:#0f1b2d;--sky:#e8edf3;--card:#ffffff;--red:#c0392b;--gold:#d9a441;--steel:#5b6b80;--line:#cfd7e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8edf3;--sky:#0b1424;--card:#142238;--red:#ef6a5b;--gold:#e6b655;--steel:#9fb0c5;--line:#243750}}
:root[data-theme="dark"]{--ink:#e8edf3;--sky:#0b1424;--card:#142238;--red:#ef6a5b;--gold:#e6b655;--steel:#9fb0c5;--line:#243750}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font:17px/1.5 Georgia,"PT Serif",serif;display:flex;justify-content:center}
.app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;padding:0 14px}
header{padding:22px 4px 14px;border-bottom:3px solid var(--red)}
h1{margin:0;font-size:1.5rem;line-height:1.2}
header p{margin:4px 0 0;color:var(--steel);font-size:.95rem}
#log{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 15px;border-radius:14px;white-space:pre-wrap}
.bot{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);align-self:flex-start}
.me{background:var(--ink);color:var(--sky);align-self:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
.chips button{font:inherit;font-size:.9rem;background:transparent;color:var(--ink);border:1px solid var(--steel);border-radius:20px;padding:6px 13px;cursor:pointer}
.chips button:hover{border-color:var(--red);color:var(--red)}
form{display:flex;gap:8px;padding:10px 0 18px}
#log{min-height:0}
.st{margin-top:6px;font-size:.8rem;color:var(--steel)}
button:disabled{opacity:.55;cursor:default}
input{flex:1;min-width:0;font:inherit;padding:11px 14px;border:1px solid var(--steel);border-radius:10px;background:var(--card);color:var(--ink)}
.send{font:inherit;background:var(--red);color:#fff;border:0;border-radius:10px;padding:0 20px;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Россия: любовь к Родине и подвиг Добровольского</h1>
    <p>Спросите о России, патриотизме или космонавте Георгии Добровольском</p>
    <div class="st" id="st"></div>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="Напишите свой вопрос здесь…" aria-label="Ваш вопрос">
    <button class="send" type="submit">Отправить</button>
  </form>
</div>
<script>
const KB = [
 {k:["привет","здравствуй","добрый","hi","hello"],a:"Здравствуйте! Я отвечаю на вопросы о патриотизме и о космонавте Георгии Добровольском. С чего начнём?"},
 {k:["что такое патриотизм","определение","значит","патриотизм"],a:"Патриотизм — это любовь к своей Родине, уважение к её истории, культуре и людям, и готовность трудиться ради её блага.\n\nСлово происходит от греческого «patris» — отечество."},
 {k:["история слова","откуда слово","происхожден","греч"],a:"Слово «патриот» пришло из греческого языка: «patriotes» — соотечественник, «patris» — отечество. В русский язык оно вошло в XVIII веке."},
 {k:["национализм","разница","отличи"],a:"Патриотизм — любовь к своей стране и желание ей добра. Национализм же часто строится на превосходстве одной нации над другими. Патриот может уважать и другие народы."},
 {k:["быт","повседнев","каждый день","как проявля","как быть","что делать"],a:"Патриотизм проявляется в обычных делах:\n• честно учиться и работать;\n• беречь природу и чистоту своего города;\n• знать историю семьи и страны;\n• помогать людям рядом;\n• уважать ветеранов и память о героях."},
 {k:["пословиц","поговорк"],a:"Народная мудрость: «Родина — мать, умей за неё постоять», «Жить — Родине служить», «Нет земли краше, чем Родина наша»."},
 {k:["герой","пример","подвиг"],a:"Примеры служения Родине: защитники Отечества, учёные, врачи, учителя, космонавты. Один из них — Георгий Добровольский, командир экипажа «Союза-11». Хотите узнать о нём?"},
 {k:["кто такой","добровольск","георгий","космонавт"],a:"Георгий Тимофеевич Добровольский (1 июня 1928 — 30 июня 1971) — советский лётчик-космонавт, Герой Советского Союза (посмертно). Родился в Одессе, был военным лётчиком, в 1963 году зачислен в отряд космонавтов."},
 {k:["союз-11","союз 11","салют","станция","полёт","полет"],a:"В июне 1971 года Добровольский командовал экипажем «Союза-11» вместе с Владиславом Волковым и Виктором Пацаевым. Они стали первым экипажем, работавшим на первой в мире орбитальной станции «Салют-1» и провели в космосе около 23 суток."},
 {k:["гибел","смерть","погиб","трагед","умер","авари"],a:"30 июня 1971 года при возвращении на Землю в спускаемом аппарате произошла разгерметизация, и экипаж погиб. Это была трагедия, после которой изменили конструкцию кораблей и требования к безопасности — космонавтов стали отправлять в скафандрах."},
 {k:["память","похорон","кремл","кратер","наград"],a:"Прах Георгия Добровольского и его товарищей захоронен в Кремлёвской стене на Красной площади. Его именем названы кратер на Луне и улицы в разных городах."},
 {k:["почему","патриот","связь","урок","чему учит"],a:"Добровольский — пример служения делу, которое больше тебя самого: он рисковал жизнью ради науки и своей страны. Такой подвиг показывает, что патриотизм — это не слова, а труд, ответственность и верность долгу."},
 {k:["россия","росси","страна","о стране","рф"],a:"Россия — самая большая страна мира по площади: около 17,1 млн км². Она расположена в Восточной Европе и Северной Азии и имеет 11 часовых поясов. Столица — Москва. В стране живут представители более ста народов, государственный язык — русский.\n\nМогу рассказать о символах, праздниках, природе, культуре и науке."},
 {k:["столиц","москв"],a:"Столица России — Москва. Первое упоминание о ней в летописи относится к 1147 году. В центре города находятся Кремль и Красная площадь."},
 {k:["символ","флаг","герб","гимн"],a:"Государственные символы России:\n• флаг — три горизонтальные полосы: белая, синяя, красная;\n• герб — золотой двуглавый орёл на красном щите;\n• гимн — музыка Александра Александрова, слова Сергея Михалкова."},
 {k:["праздник","день россии","день победы","день единства","12 июня","9 мая","4 ноября"],a:"Главные государственные праздники:\n• 9 мая — День Победы, память о победе в Великой Отечественной войне;\n• 12 июня — День России;\n• 4 ноября — День народного единства, в память об ополчении Минина и Пожарского, освободившем Москву в 1612 году;\n• 23 февраля — День защитника Отечества."},
 {k:["природ","байкал","река","волга","озеро","гора","эльбрус","география"],a:"Природа России очень разнообразна: тайга, тундра, степи, горы. Байкал — самое глубокое озеро мира (около 1640 м) и хранит примерно пятую часть мировых запасов пресной воды. Волга — самая длинная река Европы, а Эльбрус (5642 м) — высочайшая вершина Европы."},
 {k:["культур","литератур","писател","пушкин","толстой","достоевск","чехов","поэт"],a:"Русская литература известна во всём мире: Александр Пушкин, Лев Толстой, Фёдор Достоевский, Антон Чехов. Пушкина называют основоположником современного русского литературного языка."},
 {k:["музык","композитор","чайковск","балет"],a:"Русская музыка и балет — гордость страны. Пётр Чайковский написал балеты «Лебединое озеро», «Спящая красавица» и «Щелкунчик», которые идут на сценах всего мира."},
 {k:["наук","ученый","учёный","менделеев","ломоносов","изобрет","открыти"],a:"Михаил Ломоносов основал Московский университет (1755). Дмитрий Менделеев в 1869 году создал Периодическую систему химических элементов. Российские учёные внесли большой вклад в физику, математику, химию и медицину."},
 {k:["гагарин","спутник","космос","космическ","терешкова"],a:"4 октября 1957 года в СССР запустили первый в мире искусственный спутник Земли. 12 апреля 1961 года Юрий Гагарин стал первым человеком в космосе, а в 1963 году Валентина Терешкова — первой женщиной-космонавтом. Среди тех, кто продолжил это дело, — Георгий Добровольский."},
 {k:["язык","русский язык"],a:"Русский язык — государственный язык России и один из шести официальных языков ООН. День русского языка отмечается 6 июня, в день рождения Пушкина."},
 {k:["война","политик","украин","конфликт","президент","выбор"],a:"Я рассказываю об истории, культуре, природе, символах и людях России. Современные политические споры и конфликты — сложные темы, по ним лучше читать разные надёжные источники и обсуждать их с учителем или родителями."},
 {k:["спасибо","пока","до свидания"],a:"Пожалуйста! Если появятся ещё вопросы — спрашивайте."}
];
const FALL = "Я пока не знаю ответа на этот вопрос. Попробуйте спросить: «Расскажи о России», «Что такое патриотизм?» или «Кто такой Добровольский?», или нажмите «Викторина».";
const log = document.getElementById("log"), q = document.getElementById("q"), chips = document.getElementById("chips");
const SUG = ["Расскажи о России","Символы России","Праздники России","Природа России","Что такое патриотизм?","Патриотизм и национализм","Как проявлять патриотизм?","Кто такой Добровольский?","Полёт «Союза-11»"];
function add(t, cls){const d=document.createElement("div");d.className="msg "+cls;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function norm(s){return s.toLowerCase().replace(/ё/g,"е")}
function reply(text){
  const t = norm(text); let best=null, score=0;
  for(const e of KB){let s=0;for(const k of e.k){if(t.includes(norm(k)))s+=k.length}if(s>score){score=s;best=e}}
  return best ? best.a : FALL;
}
const SYS="Ты дружелюбный чат-бот для школьников. Отвечай по-русски, понятно и коротко (до 120 слов). Темы: Россия (история, культура, природа, символы, наука), патриотизм, космонавт Георгий Добровольский (1928–1971, командир «Союза-11»). Не выдумывай факты; если не уверен, так и скажи. Если вопрос о современных политических спорах или конфликтах, объясни, что тема сложная, и посоветуй сверяться с разными надёжными источниками. Если вопрос совсем не по теме, вежливо верни разговор к этим темам.";
let AI=null;const hist=[],st=document.getElementById("st");
function stLabel(){st.textContent=AI?"ИИ-режим включён: можно спрашивать о чём угодно":"Офлайн-режим: встроенные ответы. ИИ работает в опубликованной версии."}
stLabel();
try{if(window.claude&&claude.use)claude.use("sample").then(x=>{AI=x;stLabel()},()=>{})}catch(e){}
async function askAI(text){
  const ctx=hist.slice(-6).map(m=>(m.r==="u"?"Ученик: ":"Бот: ")+m.t).join("\n");
  const r=await AI(SYS+"\n\n"+(ctx?"Предыдущий разговор:\n"+ctx+"\n\n":"")+"Новый вопрос ученика: "+text+"\n\nОтветь только текстом ответа.",{cache:false});
  hist.push({r:"u",t:text},{r:"a",t:r.text});
  return r.text;
}
const FACTS=["Юрий Гагарин совершил один виток вокруг Земли, и полёт длился 108 минут.","Первый искусственный спутник Земли весил около 83 кг и летал по орбите 4 октября 1957 года.","В озеро Байкал впадает более 300 рек, а вытекает только одна — Ангара.","Станция «Салют-1» была выведена на орбиту 19 апреля 1971 года, а через два месяца на неё прибыл экипаж «Союза-11» с Добровольским.","Транссибирская магистраль длиннее 9000 км и пересекает семь часовых поясов.","Московский метрополитен открылся в 1935 году.","Русский язык — один из шести официальных языков ООН.","На обратной стороне Луны есть кратер Добровольский, названный в честь космонавта."];
let fi=Math.floor(Math.random()*FACTS.length);
function fact(){fi=(fi+1)%FACTS.length;add("Интересный факт: "+FACTS[fi],"bot")}
const QZ=[
 {q:"Кто стал первым человеком в космосе?",o:["Алексей Леонов","Юрий Гагарин","Георгий Добровольский","Герман Титов"],a:1,e:"Это произошло 12 апреля 1961 года."},
 {q:"В каком году Добровольский командовал экипажем «Союза-11»?",o:["1957","1961","1971","1981"],a:2,e:"Полёт проходил в июне 1971 года."},
 {q:"Как называлась первая в мире орбитальная станция, где работал его экипаж?",o:["«Мир»","«Салют-1»","«Скайлэб»","МКС"],a:1,e:"«Салют-1» запустили 19 апреля 1971 года."},
 {q:"Какое озеро самое глубокое в мире?",o:["Ладожское","Онежское","Байкал","Телецкое"],a:2,e:"Глубина Байкала около 1640 метров."},
 {q:"Какие цвета на флаге России сверху вниз?",o:["красный, синий, белый","белый, синий, красный","синий, белый, красный","белый, красный, синий"],a:1,e:"Белый, синий, красный."},
 {q:"Кто создал Периодическую систему химических элементов?",o:["Ломоносов","Павлов","Менделеев","Попов"],a:2,e:"Дмитрий Менделеев сделал это в 1869 году."},
 {q:"Какой праздник отмечают 4 ноября?",o:["День Победы","День России","День народного единства","День космонавтики"],a:2,e:"Он напоминает об ополчении Минина и Пожарского 1612 года."}
];
function quiz(){
  let i=0,sc=0;
  add("Викторина: "+QZ.length+" вопросов. Выбирайте ответы кнопками.","bot");
  (function next(){
    if(i>=QZ.length){add("Результат: "+sc+" из "+QZ.length+". "+(sc>=6?"Отлично, вы настоящий знаток!":sc>=4?"Хорошо! Спросите меня о том, что осталось непонятным.":"Хорошее начало! Расспросите меня о России и Добровольском и попробуйте ещё раз."),"bot");return}
    const Q=QZ[i],d=add((i+1)+". "+Q.q,"bot"),w=document.createElement("div");w.className="chips";
    Q.o.forEach((t,j)=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=()=>{
      w.querySelectorAll("button").forEach(x=>x.disabled=true);
      const ok=j===Q.a;if(ok)sc++;
      b.style.borderColor=ok?"#2e9e5b":"var(--red)";
      add((ok?"Верно! ":"Неверно. Правильный ответ: "+Q.o[Q.a]+". ")+Q.e,"bot");i++;next()};w.appendChild(b)});
    d.appendChild(w);log.scrollTop=log.scrollHeight})();
}
async function ask(text){
  const t=norm(text);
  if(t.includes("виктор")){add(text,"me");quiz();return}
  if(t.includes("факт")&&t.length<25){add(text,"me");fact();return}
  add(text,"me");q.disabled=true;
  if(AI){
    const w=add("Думаю…","bot");
    try{w.textContent=await askAI(text)}
    catch(e){w.textContent=reply(text)+"\n\n"+(e&&e.code==="not_granted"?"(ИИ-режим не разрешён. Задайте вопрос ещё раз и разрешите доступ.)":"(ИИ сейчас недоступен, показан встроенный ответ.)")}
  }else{
    await new Promise(r=>setTimeout(r,350));
    add(reply(text),"bot");
  }
  q.disabled=false;q.focus();
}
[["Викторина",quiz],["Случайный факт",fact]].forEach(([t,fn])=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.style.borderColor="var(--gold)";b.onclick=()=>{add(t,"me");fn()};chips.appendChild(b)});
SUG.forEach(s=>{const b=document.createElement("button");b.type="button";b.textContent=s;b.onclick=()=>ask(s);chips.appendChild(b)});
document.getElementById("f").onsubmit=e=>{e.preventDefault();const v=q.value.trim();if(!v)return;q.value="";ask(v)};
add("Здравствуйте! Я чат-бот о России, патриотизме и космонавте Георгии Добровольском. Выберите вопрос ниже или напишите свой.","bot");
</script>
</body>
</html>
